    Feature:
      properties:
        applies_to:
          description:
            "The type of object the feature applies to (RootAccount, Account,\
            \ Course, or User):\n * RootAccount features may only be controlled by\
            \ flags on root accounts.\n * Account features may be controlled by flags\
            \ on accounts and their parent accounts.\n * Course features may be controlled\
            \ by flags on courses and their parent accounts.\n * User features may\
            \ be controlled by flags on users and site admin only."
          example: Course
          nullable: true
          type: string
        autoexpand:
          description:
            Whether the details of the feature are autoexpanded on page
            load vs. the user clicking to expand.
          example: true
          nullable: true
          type: boolean
        beta:
          description:
            Whether the feature is a beta feature. If true, the feature
            may not be fully polished and may be subject to change in the future.
          example: true
          nullable: true
          type: boolean
        development:
          description:
            Whether the feature is in active development. Features in this
            state are only visible in test and beta instances and are not yet available
            for production use.
          example: false
          nullable: true
          type: boolean
        display_name:
          description: The user-visible name of the feature
          example: Fancy Wickets
          nullable: true
          type: string
        enable_at:
          description:
            The date this feature will be globally enabled, or null if
            this is not planned. (This information is subject to change.)
          example: 2014-01-01 00:00:00+00:00
          format: date-time
          nullable: true
          type: string
        feature_flag:
          $ref: "#/components/schemas/FeatureFlagNullable"
        name:
          description: The symbolic name of the feature, used in FeatureFlags
          example: fancy_wickets
          nullable: true
          type: string
        release_notes_url:
          description: A URL to the release notes describing the feature
          example: http://canvas.example.com/release_notes#fancy_wickets
          nullable: true
          type: string
        root_opt_in:
          description:
            If true, a feature that is 'allowed' globally will be 'off'
            by default in root accounts. Otherwise, root accounts inherit the global
            'allowed' setting, which allows sub-accounts and courses to turn features
            on with no root account action.
          example: true
          nullable: true
          type: boolean
      type: object
    FeatureFlag:
      properties:
        context_id:
