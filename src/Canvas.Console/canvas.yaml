    SubmissionHistory:
      properties:
        submission_id:
          description: the id of the submission
          example: 4
          nullable: true
          type: integer
        versions:
          description: an array of all the versions of this submission
          items:
            $ref: "#/components/schemas/SubmissionVersion"
          nullable: true
          type: array
      type: object
    SubmissionVersion:
      description:
        A SubmissionVersion object contains all the fields that a Submission
        object does, plus additional fields prefixed with current_* new_* and previous_*
        described below.
      properties:
        assignment_id:
          description: the id of the assignment this submissions is for
          example: 22604
          nullable: true
          type: integer
        assignment_name:
          description: the name of the assignment this submission is for
          example: some assignment
          nullable: true
          type: string
        body:
          description: the body text of the submission
          example: text from the submission
          nullable: true
          type: string
        current_grade:
          description: the most up to date grade for the current version of this submission
          example: "100"
          nullable: true
          type: string
        current_graded_at:
          description: the latest time stamp for the grading of this submission
          example: 2013-01-31 18:16:31+00:00
          format: date-time
          nullable: true
          type: string
        current_grader:
          description: the name of the most recent grader for this submission
          example: Grader Name
          nullable: true
          type: string
        grade_matches_current_submission:
          description:
            boolean indicating whether the grade is equal to the current
            submission grade
          example: true
          nullable: true
          type: boolean
        graded_at:
          description: time stamp for the grading of this version of the submission
          example: 2013-01-31 18:16:31+00:00
          format: date-time
          nullable: true
          type: string
        grader:
          description: the name of the user who graded this version of the submission
          example: Grader Name
          nullable: true
          type: string
        grader_id:
          description: the user id of the user who graded this version of the submission
          example: 67379
          nullable: true
          type: integer
        id:
          description: the id of the submission of which this is a version
          example: 11607
          type: integer
        new_grade:
          description: the updated grade provided in this version of the submission
          example: "100"
          nullable: true
          type: string
        new_graded_at:
          description:
            the timestamp for the grading of this version of the submission
            (alias for graded_at)
          example: 2013-01-31 18:16:31+00:00
          format: date-time
          nullable: true
          type: string
        new_grader:
          description: alias for 'grader'
          example: Grader Name
          nullable: true
          type: string
        previous_grade:
          description:
            the grade for the submission version immediately preceding
            this one
          example: "90"
          nullable: true
          type: string
        previous_graded_at:
          description:
            the timestamp for the grading of the submission version immediately
            preceding this one
          example: 2013-01-29 12:12:12+00:00
          format: date-time
          nullable: true
          type: string
        previous_grader:
          description:
            the name of the grader who graded the version of this submission
            immediately preceding this one
          example: Graded on submission
          nullable: true
          type: string
        score:
          description: the score for this version of the submission
          example: 100
          nullable: true
          type: integer
        submission_type:
          description: the type of submission
          example: online
          nullable: true
          type: string
        url:
          description: the url of the submission, if there is one
          nullable: true
          type: string
        user_id:
          description: the user ID of the student who created this submission
          example: 67376
          nullable: true
          type: integer
        user_name:
          description: the name of the student who created this submission
          example: student@example.com
          nullable: true
          type: string
        workflow_state:
          description: the state of the submission at this version
          example: unsubmitted
          nullable: true
          type: string
      type: object
