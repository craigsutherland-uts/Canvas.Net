          description:
            Whether this event should be displayed on the calendar. Only
            true for course-level events with section-level child events.
          example: false
          nullable: true
          type: boolean
        html_url:
          description: URL for a user to view this event
          example: https://example.com/calendar?event_id=234&include_contexts=course_123
          nullable: true
          type: string
        id:
          description: The ID of the calendar event
          example: 234
          nullable: true
          type: integer
        location_address:
          description: The address where the event is taking place
          example: Greendale, Colorado
          nullable: true
          type: string
        location_name:
          description: The location name of the event
          example: Greendale Community College
          nullable: true
          type: string
        own_reservation:
          description:
            If the event is a reservation, this a boolean indicating whether
            it is the current user's reservation, or someone else's
          example: false
          nullable: true
          type: boolean
        parent_event_id:
          description:
            Normally null. If this is a reservation (see the Appointment
            Groups API), the id will indicate the time slot it is for. If this is
            a section-level event, this will be the course-level parent event.
          nullable: true
          type: integer
        participant_type:
          description: "The type of participant to sign up for a slot: 'User' or
            'Group'"
          example: User
          nullable: true
          type: string
        participants_per_appointment:
          description: If the event is a time slot, this is the participant limit
          nullable: true
          type: integer
        reserve_url:
          description: If the event is a time slot, the API URL for reserving it
          nullable: true
          type: string
        reserved:
          description:
            If the event is a time slot, a boolean indicating whether the
            user has already made a reservation for it
          example: false
          nullable: true
          type: boolean
        start_at:
          description: The start timestamp of the event
          example: 2012-07-19 15:00:00-06:00
          format: date-time
          nullable: true
          type: string
        title:
          description: The title of the calendar event
          example: Paintball Fight!
          nullable: true
          type: string
        updated_at:
          description: When the calendar event was last updated
          example: 2012-07-12 10:55:20-06:00
          format: date-time
          nullable: true
          type: string
        url:
          description: URL for this calendar event (to update, delete, etc.)
          example: https://example.com/api/v1/calendar_events/234
          type: string
        user:
          description:
            If the event is a user-level reservation, this will contain
            the user participant JSON (refer to the Users API).
          nullable: true
          type: string
        workflow_state:
          description:
            Current state of the event ('active', 'locked' or 'deleted')
            'locked' indicates that start_at/end_at cannot be changed (though the
            event could be deleted). Normally only reservations or time slots with
            reservations are locked (see the Appointment Groups API)
          example: active
          nullable: true
          type: string
      type: object
