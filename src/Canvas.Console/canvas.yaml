          type: string
        current_period_override_score:
          description: The user's override score for the current grading period.
          nullable: true
          type: number
        current_period_unposted_current_grade:
          description:
            "optional: The letter grade equivalent of current_period_unposted_current_score,
            if available. Only included if user has permission to view this grade,
            typically teachers, TAs, and admins. If the course the enrollment belongs
            to does not have grading periods, or if no currently active grading period
            exists, the value will be null. (applies only to student enrollments,
            and only available in course endpoints)"
          example: A
          nullable: true
          type: string
        current_period_unposted_current_score:
          description:
            "optional: The student's score in the course for the current
            grading period, including muted/unposted assignments. Only included if
            user has permission to view this score, typically teachers, TAs, and admins.
            If the course the enrollment belongs to does not have grading periods,
            or if no currently active grading period exists, the value will be null.
            (applies only to student enrollments, and only available in course endpoints)"
          example: 95.8
          nullable: true
          type: number
        current_period_unposted_final_grade:
          description:
            "optional: The letter grade equivalent of current_period_unposted_final_score,
            if available. Only included if user has permission to view this grade,
