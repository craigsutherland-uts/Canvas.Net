          nullable: true
          type: integer
        section_integration_id:
          description:
            The Section Integration ID in which the enrollment is associated.
            This field is only included if the user has permission to view SIS information.
          example: SHEL93921
          nullable: true
          type: string
        sis_account_id:
          description:
            The SIS Account ID in which the enrollment is associated. Only
            displayed if present. This field is only included if the user has permission
