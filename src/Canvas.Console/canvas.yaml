          example: /api/v1/accounts/1/outcome_groups/1/subgroups
          nullable: true
          type: string
        title:
          description: title of the outcome group
          example: Outcome group title
          nullable: true
          type: string
        url:
          description:
            the URL for fetching/updating the outcome group. should be
            treated as opaque
          example: /api/v1/accounts/1/outcome_groups/1
          nullable: true
          type: string
        vendor_guid:
          description: A custom GUID for the learning standard.
          example: customid9000
          nullable: true
          type: string
      type: object
    OutcomeImport:
      properties:
        created_at:
          description: The date the outcome import was created.
          example: 2013-12-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        data:
          $ref: "#/components/schemas/OutcomeImportData"
        ended_at:
          description: The date the outcome import finished. Returns null if not finished.
          example: 2013-12-02 00:03:21-06:00
          format: date-time
          nullable: true
          type: string
        id:
          description: The unique identifier for the outcome import.
          example: 1
          type: integer
        processing_errors:
          description:
            An array of row number / error message pairs. Returns the first
            25 errors.
          example:
            - - 1
              - "Missing required fields: title"
          items:
            items:
              properties: {}
              type: object
            type: array
          nullable: true
          type: array
        progress:
          description: The progress of the outcome import.
          example: "100"
          nullable: true
          type: string
        updated_at:
          description: The date the outcome import was last updated.
          example: 2013-12-02 00:03:21-06:00
          format: date-time
          nullable: true
          type: string
        user:
          $ref: "#/components/schemas/UserNullable"
        workflow_state:
          description:
            "The current state of the outcome import.\n - 'created': The\
            \ outcome import has been created.\n - 'importing': The outcome import\
            \ is currently processing.\n - 'succeeded': The outcome import has completed\
            \ successfully.\n - 'failed': The outcome import failed."
          example: imported
          nullable: true
          type: string
      type: object
    OutcomeImportData:
      nullable: true
      properties:
        import_type:
          description: The type of outcome import
          example: instructure_csv
          nullable: true
          type: string
      type: object
    OutcomeLink:
      properties:
        assessed:
          description:
            whether this outcome has been used to assess a student in the
            context of this outcome link.  In other words, this will be set to true
            if the context is a course, and a student has been assessed with this
            outcome in that course.
          example: true
          nullable: true
          type: boolean
        can_unlink:
          description:
            whether this outcome link is manageable and is not the last
            link to an aligned outcome
          nullable: true
          type: boolean
        context_id:
          description:
            the context owning the outcome link. will match the context
            owning the outcome group containing the outcome link; included for convenience.
            may be null for links in global outcome groups.
          example: 1
          nullable: true
          type: integer
        context_type:
          example: Account
          nullable: true
          type: string
        outcome:
          $ref: "#/components/schemas/OutcomeNullable"
        outcome_group:
          $ref: "#/components/schemas/OutcomeGroupNullable"
        url:
          description:
            the URL for fetching/updating the outcome link. should be treated
            as opaque
          example: /api/v1/accounts/1/outcome_groups/1/outcomes/1
          nullable: true
          type: string
      type: object
