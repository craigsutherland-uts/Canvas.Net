        unknown_user_url:
          description:
            If an unknown user url is set, Canvas will forward to that
            url when a service authenticates a user, but that user does not exist
            in Canvas. The default behavior is to present an error.
          example: https://example.com/register_for_canvas
          nullable: true
          type: string
      type: object
