          example:
            - - students.csv
              - Error while importing CSV. Please contact support.
          items:
            items:
              type: string
            type: array
          nullable: true
          type: array
        processing_warnings:
          description:
            Only imports that are complete will get this data. An array
            of CSV_file/warning_message pairs.
          example:
            - - students.csv
              - user John Doe has already claimed john_doe's requested login information,
                skipping
          items:
            items:
              type: string
            type: array
          nullable: true
          type: array
        progress:
          description:
            The progress of the SIS import. The progress will reset when
            using batch_mode and have a different progress for the cleanup stage
          example: "100"
          nullable: true
          type: string
        skip_deletes:
          description: When set the import will skip any deletes.
          example: false
          nullable: true
          type: boolean
        updated_at:
          description: The date the SIS import was last updated.
          example: 2013-12-02 00:03:21-06:00
          format: date-time
          nullable: true
          type: string
        user:
          $ref: "#/components/schemas/UserNullable"
        workflow_state:
          description:
            "The current state of the SIS import.\n - 'created': The SIS\
            \ import has been created.\n - 'importing': The SIS import is currently\
            \ processing.\n - 'cleanup_batch': The SIS import is currently cleaning\
            \ up courses, sections, and enrollments not included in the batch for\
            \ batch_mode imports.\n - 'imported': The SIS import has completed successfully.\n\
            \ - 'imported_with_messages': The SIS import completed with errors or\
            \ warnings.\n - 'aborted': The SIS import was aborted.\n - 'failed_with_messages':\
            \ The SIS import failed with errors.\n - 'failed': The SIS import failed."
          example: imported
          nullable: true
          type: string
      type: object
