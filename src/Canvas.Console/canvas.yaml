    Submission:
      properties:
        anonymous_id:
          description:
            A unique short ID identifying this submission without reference
            to the owning user. Only included if the caller has administrator access
            for the current account.
          nullable: true
          type: string
        assignment:
          $ref: "#/components/schemas/AssignmentNullable"
        assignment_id:
          description: The submission's assignment id
          example: 23
          nullable: true
          type: integer
        assignment_visible:
          description:
            Whether the assignment is visible to the user who submitted
            the assignment. Submissions where `assignment_visible` is false no longer
            count towards the student's grade and the assignment can no longer be
            accessed by the student. `assignment_visible` becomes false for submissions
            that do not have a grade and whose assignment is no longer assigned to
            the student's section.
          example: true
          nullable: true
          type: boolean
        attempt:
          description: This is the submission attempt number.
          example: 1
          nullable: true
          type: integer
        body:
          description:
            The content of the submission, if it was submitted directly
            in a text field.
          example: There are three factors too...
          nullable: true
          type: string
        course:
          description: The submission's course (see the course API) (optional)
          example: Course
          nullable: true
          type: string
        excused:
          description:
            Whether the assignment is excused.  Excused assignments have
            no impact on a user's grade.
          example: true
          nullable: true
          type: boolean
        extra_attempts:
          description: Extra submission attempts allowed fro the given user and assignment.
          nullable: true
          type: integer
        grade:
          description:
            The grade for the submission, translated into the assignment
            grading scheme (so a letter grade, for example).
          example: A-
          nullable: true
          type: string
        grade_matches_current_submission:
          description:
            A boolean flag which is false if the student has re-submitted
            since the submission was last graded.
          example: true
          nullable: true
          type: boolean
        graded_at:
          example: 2012-01-02 03:05:34+00:00
          format: date-time
          nullable: true
          type: string
        grader_id:
          description:
            The id of the user who graded the submission. This will be
            null for submissions that haven't been graded yet. It will be a positive
            number if a real user has graded the submission and a negative number
            if the submission was graded by a process (e.g. Quiz autograder and autograding
            LTI tools).  Specifically autograded quizzes set grader_id to the negative
            of the quiz id.  Submissions autograded by LTI tools set grader_id to
            the negative of the tool id.
          example: 86
          nullable: true
          type: integer
        html_url:
          description: URL to the submission. This will require the user to log in.
          example: http://example.com/courses/255/assignments/543/submissions/134
          nullable: true
          type: string
        late:
          description: Whether the submission was made after the applicable due date
          example: false
          nullable: true
          type: boolean
        late_policy_status:
          description:
            The status of the submission in relation to the late policy.
            Can be late, missing, none, or null.
          example: missing
          nullable: true
          type: string
        missing:
          description: Whether the assignment is missing.
          example: true
          nullable: true
          type: boolean
        points_deducted:
          description:
            The amount of points automatically deducted from the score
            by the missing/late policy for a late or missing assignment.
          example: 12.3
          nullable: true
          type: number
        posted_at:
          description:
            The date this submission was posted to the student, or nil
            if it has not been posted
          nullable: true
          type: string
        preview_url:
          description:
            URL to the submission preview. This will require the user to
            log in.
          example: http://example.com/courses/255/assignments/543/submissions/134?preview=1
          nullable: true
          type: string
        read_status:
          description:
            The read status of this submission for the given user (optional).
            Including read_status will mark submission(s) as read.
          nullable: true
          type: string
        redo_request:
          description:
            This indicates whether the submission has been reassigned by
            the instructor.
          nullable: true
          type: boolean
        score:
          description: The raw score
          example: 13.5
          nullable: true
          type: number
        seconds_late:
          description:
            The amount of time, in seconds, that an submission is late
            by.
          example: 300.0
          nullable: true
          type: number
        submission_comments:
          description: Associated comments for a submission (optional)
          items:
            $ref: "#/components/schemas/SubmissionComment"
          nullable: true
          type: array
        submission_type:
          description: "The types of submission ex: ('online_text_entry'|'online_url'|'online_upload'|'media_recording')"
          example: online_text_entry
          nullable: true
          type: string
        submitted_at:
          description: The timestamp when the assignment was submitted
          example: 2012-01-01 01:00:00+00:00
          format: date-time
          nullable: true
          type: string
        url:
          description: The URL of the submission (for 'online_url' submissions).
          nullable: true
          type: string
        user:
          description: The submissions user (see user API) (optional)
          example: User
          nullable: true
          type: string
        user_id:
          description: The id of the user who created the submission
          example: 134
          nullable: true
          type: integer
        workflow_state:
          description: The current state of the submission
          example: submitted
          nullable: true
          type: string
      type: object
