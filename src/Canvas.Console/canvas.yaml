    Avatar:
      description: Possible avatar for a user.
      properties:
        content-type:
          description: "['attachment' type only] the content-type of the attachment."
          example: image/jpeg
          nullable: true
          type: string
        display_name:
          description: A textual description of the avatar record.
          example: user, sample
          type: string
        filename:
          description: "['attachment' type only] the filename of the attachment"
          example: profile.jpg
          nullable: true
          type: string
        id:
          description: "['attachment' type only] the internal id of the attachment"
          example: 12
          nullable: true
          type: integer
        size:
          description: "['attachment' type only] the size of the attachment"
          example: 32649
          nullable: true
          type: integer
        token:
          description:
            "A unique representation of the avatar record which can be
            used to set the avatar with the user update endpoint. Note: this is an
            internal representation and is subject to change without notice. It should
            be consumed with this api endpoint and used in the user update endpoint,
            and should not be constructed by the client."
          example: <opaque_token>
          type: string
        type:
          description: "['gravatar'|'attachment'|'no_pic'] The type of avatar
            record, for categorization purposes."
          example: gravatar
          type: string
        url:
          description: The url of the avatar
          example: https://secure.gravatar.com/avatar/2284...
          type: string
      required:
        - display_name
        - token
        - type
        - url
      type: object
