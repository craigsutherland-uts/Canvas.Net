          example: SHEL93921
          nullable: true
          type: string
        sis_course_id:
          description:
            The SIS Course ID in which the enrollment is associated. Only
            displayed if present. This field is only included if the user has permission
            to view SIS information.
          example: SHEL93921
          nullable: true
          type: string
        sis_import_id:
          description:
            The unique identifier for the SIS import. This field is only
            included if the user has permission to manage SIS information.
          example: 83
          nullable: true
          type: integer
        sis_section_id:
          description:
            The SIS Section ID in which the enrollment is associated. Only
            displayed if present. This field is only included if the user has permission
            to view SIS information.
          example: SHEL93921
          nullable: true
          type: string
        sis_user_id:
          description:
            The SIS User ID in which the enrollment is associated. Only
            displayed if present. This field is only included if the user has permission
            to view SIS information.
          example: SHEL93921
          nullable: true
          type: string
        start_at:
          description: The start time of the enrollment, in ISO8601 format.
          example: 2012-04-18 23:08:51+00:00
          format: date-time
