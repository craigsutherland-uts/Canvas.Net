        course_id:
          example: 3
          nullable: true
          type: integer
        description:
          description: A description of the group. This is plain text.
          nullable: true
          type: string
        followed_by_user:
          description: Whether or not the current user is following this group.
          example: false
          nullable: true
          type: boolean
        group_category_id:
          description: The ID of the group's category.
          example: 4
          nullable: true
          type: integer
        id:
          description: The ID of the group.
          example: 17
          type: integer
        is_public:
          description:
            Whether or not the group is public.  Currently only community
            groups can be made public.  Also, once a group has been set to public,
            it cannot be changed back to private.
          example: false
          nullable: true
          type: boolean
        join_level:
          description:
            How people are allowed to join the group.  For all groups except
            for community groups, the user must share the group's parent course or
            account.  For student organized or community groups, where a user can
            be a member of as many or few as they want, the applicable levels are
            'parent_context_auto_join', 'parent_context_request', and 'invitation_only'.  For
            class groups, where students are divided up and should only be part of
            one group of the category, this value will always be 'invitation_only',
            and is not relevant. * If 'parent_context_auto_join', anyone can join
            and will be automatically accepted. * If 'parent_context_request', anyone  can
            request to join, which must be approved by a group moderator. * If 'invitation_only',
            only those how have received an invitation my join the group, by accepting
            that invitation.
          example: invitation_only
          nullable: true
          type: string
        members_count:
          description: The number of members currently in the group
          example: 0
          nullable: true
          type: integer
        name:
          description: The display name of the group.
          example: Math Group 1
          nullable: true
          type: string
        permissions:
          description:
            "optional: the permissions the user has for the group. returned
            only for a single group and include[]=permissions"
          example:
            create_announcement: true
            create_discussion_topic: true
          nullable: true
          properties: {}
          type: object
        role:
          description:
            "Certain types of groups have special role designations. Currently,
            these include: 'communities', 'student_organized', and 'imported'.
            Regular course/account groups have a role of null."
          nullable: true
          type: string
        sis_group_id:
          description:
            The SIS ID of the group. Only included if the user has permission
            to view SIS information.
          example: group4a
          nullable: true
          type: string
        sis_import_id:
          description:
            The id of the SIS import if created through SIS. Only included
            if the user has permission to manage SIS information.
          example: 14
          nullable: true
          type: integer
        storage_quota_mb:
          description: the storage quota for the group, in megabytes
          example: 50
          nullable: true
          type: integer
      type: object
    GroupCategory:
      properties:
        account_id:
          example: 3
          nullable: true
          type: integer
        auto_leader:
          description:
            Gives instructors the ability to automatically have group leaders
            assigned.  Values include 'random', 'first', and null; 'random' picks
            a student from the group at random as the leader, 'first' sets the first
            student to be assigned to the group as the leader
          nullable: true
          type: string
        context_type:
          description:
            The course or account that the category group belongs to. The
            pattern here is that whatever the context_type is, there will be an _id
            field named after that type. So if instead context_type was 'Course',
            the course_id field would be replaced by an course_id field.
          example: Account
          nullable: true
          type: string
        group_limit:
          description:
            If self-signup is enabled, group_limit can be set to cap the
            number of users in each group. If null, there is no limit.
          nullable: true
          type: integer
        id:
          description: The ID of the group category.
          example: 17
          type: integer
        name:
          description: The display name of the group category.
          example: Math Groups
          nullable: true
          type: string
        progress:
          $ref: "#/components/schemas/ProgressNullable"
        role:
          description:
            "Certain types of group categories have special role designations.
            Currently, these include: 'communities', 'student_organized', and
            'imported'. Regular course/account group categories have a role of null."
          example: communities
          nullable: true
          type: string
        self_signup:
          description:
            If the group category allows users to join a group themselves,
            thought they may only be a member of one group per group category at a
            time. Values include 'restricted', 'enabled', and null 'enabled' allows
            students to assign themselves to a group 'restricted' restricts them to
            only joining a group in their section null disallows students from joining
            groups
          nullable: true
          type: string
        sis_group_category_id:
          description:
            The SIS identifier for the group category. This field is only
            included if the user has permission to manage or view SIS information.
          nullable: true
          type: string
        sis_import_id:
          description:
            The unique identifier for the SIS import. This field is only
            included if the user has permission to manage SIS information.
          nullable: true
          type: integer
      type: object
    GroupMembership:
