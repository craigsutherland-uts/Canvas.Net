            If set, this feature flag cannot be changed in the caller's
            context because the flag is set 'off' or 'on' in a higher context
          example: false
          nullable: true
          type: boolean
        state:
          description:
            The policy for the feature at this context.  can be 'off',
            'allowed', or 'on'.
          example: allowed
          nullable: true
          type: string
      type: object
    FeatureFlagNullable:
      nullable: true
      properties:
        context_id:
          description:
            The id of the object to which this flag applies (This field
            is not present if this FeatureFlag represents the global Canvas default)
          example: 1038
          nullable: true
          type: integer
        context_type:
          description:
