            type: object
          nullable: true
          type: array
        html_url:
          description: The URL to the discussion topic in canvas.
          example: https://<canvas>/courses/1/discussion_topics/2
          nullable: true
          type: string
        id:
          description: The ID of this topic.
          example: 1
          type: integer
        last_reply_at:
          description: The datetime for when the last reply was in the topic.
          example: 2037-07-28 19:38:31+00:00
          format: date-time
          nullable: true
          type: string
        lock_at:
          description: The datetime to lock the topic (if ever).
          format: date-time
          nullable: true
          type: string
        lock_explanation:
          description:
            (Optional) An explanation of why this is locked for the user.
            Present when locked_for_user is true.
          example: This discussion is locked until September 1 at 12:00am
          nullable: true
          type: string
        lock_info:
          $ref: "#/components/schemas/LockInfo"
        locked:
          description: Whether or not the discussion is 'closed for comments'.
          example: false
          nullable: true
          type: boolean
        locked_for_user:
          description: Whether or not this is locked for the user.
          example: true
          nullable: true
          type: boolean
        message:
          description: The HTML content of the message body.
          example: <p>content here</p>
          nullable: true
          type: string
        only_graders_can_rate:
          description: Whether or not grade permissions are required to rate entries.
          example: true
          nullable: true
          type: boolean
        permissions:
          description: The current user's permissions on this topic.
          example:
            attach: true
          nullable: true
          properties: {}
          type: object
        pinned:
          description: Whether or not the discussion has been 'pinned' by an instructor
          example: false
          nullable: true
          type: boolean
        podcast_url:
          description:
            If the topic is a podcast topic this is the feed url for the
            current user.
          example: /feeds/topics/1/enrollment_1XAcepje4u228rt4mi7Z1oFbRpn3RAkTzuXIGOPe.rss
          nullable: true
          type: string
        posted_at:
          description:
            The datetime the topic was posted. If it is null it hasn't
            been posted yet. (see delayed_post_at)
          example: 2037-07-21 13:29:31+00:00
          format: date-time
          nullable: true
          type: string
        published:
          description:
            Whether this discussion topic is published (true) or draft
            state (false)
          example: true
          nullable: true
          type: boolean
        read_state:
          description:
            The read_state of the topic for the current user, 'read' or
            'unread'.
          example: read
          nullable: true
          type: string
        require_initial_post:
          description:
            If true then a user may not respond to other replies until
            that user has made an initial reply. Defaults to false.
          example: false
          nullable: true
          type: boolean
        root_topic_id:
          description:
            If the topic is for grading and a group assignment this will
            point to the original topic in the course.
          nullable: true
          type: integer
        sort_by_rating:
          description: Whether or not entries should be sorted by rating.
          example: true
          nullable: true
          type: boolean
        subscribed:
          description: Whether or not the current user is subscribed to this topic.
          example: true
          nullable: true
          type: boolean
        subscription_hold:
          description:
            "(Optional) Why the user cannot subscribe to this topic. Only
            one reason will be returned even if multiple apply. Can be one of: 'initial_post_required':
            The user must post a reply first; 'not_in_group_set': The user is not
            in the group set for this graded group discussion; 'not_in_group': The
            user is not in this topic's group; 'topic_is_announcement': This topic
            is an announcement"
          example: not_in_group_set
          nullable: true
          type: string
        title:
          description: The topic title.
          example: Topic 1
          nullable: true
          type: string
        topic_children:
          description:
            DEPRECATED An array of topic_ids for the group discussions
            the user is a part of.
          example:
            - 5
            - 7
            - 10
          items:
            type: integer
          nullable: true
          type: array
        unread_count:
          description: The count of unread entries of this topic for the current user.
          example: 0
          nullable: true
          type: integer
        user_can_see_posts:
          description: Whether or not posts in this topic are visible to the user.
          example: true
          nullable: true
          type: boolean
        user_name:
          description: The username of the topic creator.
          example: User Name
          nullable: true
          type: string
      type: object
    Enrollment:
      properties:
