          example: 2012-04-18 23:08:51+00:00
          format: date-time
          nullable: true
          type: string
        current_grading_period_id:
          description:
            "optional: The id of the currently active grading period, if
            one exists. If the course the enrollment belongs to does not have grading
            periods, or if no currently active grading period exists, the value will
            be null. (applies only to student enrollments, and only available in course
            endpoints)"
          example: 5
          nullable: true
          type: integer
        current_grading_period_title:
          description:
            "optional: The name of the currently active grading period,
            if one exists. If the course the enrollment belongs to does not have grading
            periods, or if no currently active grading period exists, the value will
            be null. (applies only to student enrollments, and only available in course
            endpoints)"
          example: Fall Grading Period
          nullable: true
          type: string
        current_period_computed_current_grade:
          description:
            "optional: The letter grade equivalent of current_period_computed_current_score,
            if available. If the course the enrollment belongs to does not have grading
            periods, or if no currently active grading period exists, the value will
            be null. (applies only to student enrollments, and only available in course
            endpoints)"
          example: A
          nullable: true
          type: string
        current_period_computed_current_score:
          description:
            "optional: The student's score in the course for the current
            grading period, ignoring ungraded assignments. If the course the enrollment
            belongs to does not have grading periods, or if no currently active grading
            period exists, the value will be null. (applies only to student enrollments,
            and only available in course endpoints)"
          example: 95.8
          nullable: true
          type: number
        current_period_computed_final_grade:
          description:
            "optional: The letter grade equivalent of current_period_computed_final_score,
            if available. If the course the enrollment belongs to does not have grading
            periods, or if no currently active grading period exists, the value will
            be null. (applies only to student enrollments, and only available in course
            endpoints)"
          example: B
          nullable: true
          type: string
        current_period_computed_final_score:
          description:
            "optional: The student's score in the course for the current
            grading period, including ungraded assignments with a score of 0. If the
            course the enrollment belongs to does not have grading periods, or if
            no currently active grading period exists, the value will be null. (applies
            only to student enrollments, and only available in course endpoints)"
          example: 85.25
          nullable: true
          type: number
        current_period_override_grade:
          description: The user's override grade for the current grading period.
