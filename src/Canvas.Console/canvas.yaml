    ModuleItemSequence:
      properties:
        items:
          description:
            an array containing one ModuleItemSequenceNode for each appearence
            of the asset in the module sequence (up to 10 total)
          example:
            - current:
                id: 768
                module_id: 123
                title: A lonely page
                type: Page
              mastery_path:
                assignment_sets: []
                awaiting_choice: false
                choose_url: /courses/11/modules/items/9/choose
                locked: true
                modules_tab_disabled: false
                modules_url: /courses/11/modules
                still_processing: false
              next:
                id: 769
                module_id: 127
                title: Project 1
                type: Assignment
          items:
            $ref: "#/components/schemas/ModuleItemSequenceNode"
          nullable: true
          type: array
        modules:
          description: an array containing each Module referenced above
          example:
            - id: 123
              name: Overview
            - id: 127
              name: Imaginary Numbers
          items:
            $ref: "#/components/schemas/Module"
          nullable: true
          type: array
      type: object
    ModuleItemSequenceNode:
      properties:
        current:
          $ref: "#/components/schemas/ModuleItemNullable"
        mastery_path:
          description: The conditional release rule for the module item, if applicable
          example:
            assignment_sets: []
            awaiting_choice: false
            choose_url: /courses/11/modules/items/9/choose
            locked: true
            modules_tab_disabled: false
            modules_url: /courses/11/modules
            still_processing: false
          nullable: true
          properties: {}
          type: object
        next:
          $ref: "#/components/schemas/ModuleItemNullable"
        prev:
          $ref: "#/components/schemas/ModuleItemNullable"
      type: object
