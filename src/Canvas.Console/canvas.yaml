        computed_final_grade:
          description:
            "optional: The letter grade equivalent of computed_final_score,
            if available. (applies only to student enrollments, and only available
            in course endpoints)"
          example: B-
          nullable: true
          type: string
        computed_final_score:
          description:
            "optional: The student's score in the course including ungraded
            assignments with a score of 0. (applies only to student enrollments, and
            only available in course endpoints)"
          example: 80.67
          nullable: true
          type: number
        course_id:
          description: The unique id of the course.
          example: 1
          nullable: true
          type: integer
        course_integration_id:
          description:
            The Course Integration ID in which the enrollment is associated.
            This field is only included if the user has permission to view SIS information.
          example: SHEL93921
          nullable: true
