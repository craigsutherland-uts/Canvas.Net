    Quiz:
      properties:
        access_code:
          description: access code to restrict quiz access
          example: 2beornot2be
          nullable: true
          type: string
        all_dates:
          description: list of due dates for the quiz
          items:
            $ref: "#/components/schemas/AssignmentDate"
          nullable: true
          type: array
        allowed_attempts:
          description: how many times a student can take the quiz -1 = unlimited attempts
          example: 3
          nullable: true
          type: integer
        anonymous_submissions:
          description:
            Whether survey submissions will be kept anonymous (only applicable
            to 'graded_survey', 'survey' quiz types)
          example: false
          nullable: true
          type: boolean
        assignment_group_id:
          description: "the ID of the quiz's assignment group:"
          example: 3
          nullable: true
          type: integer
        cant_go_back:
          description: lock questions after answering? only valid if one_question_at_a_time=true
          example: false
          nullable: true
          type: boolean
        description:
          description: the description of the quiz
          example: This is a quiz on Act 3 of Hamlet
          nullable: true
          type: string
        due_at:
          description: when the quiz is due
          example: 2013-01-23 23:59:00-07:00
          format: date-time
          nullable: true
          type: string
        hide_correct_answers_at:
          description:
            prevent the students from seeing correct answers after the
            specified date has passed. only valid if show_correct_answers=true
          example: 2013-01-23 23:59:00-07:00
          format: date-time
          nullable: true
          type: string
        hide_results:
          description:
            "let students see their quiz responses? possible values: null,
            'always', 'until_after_last_attempt'"
          example: always
          nullable: true
          type: string
        html_url:
          description: the HTTP/HTTPS URL to the quiz
          example: http://canvas.example.edu/courses/1/quizzes/2
          nullable: true
          type: string
        id:
          description: the ID of the quiz
          example: 5
          type: integer
        ip_filter:
          description: IP address or range that quiz access is limited to
          example: 123.123.123.123
          nullable: true
          type: string
        lock_at:
          description: when to lock the quiz
          format: date-time
          nullable: true
          type: string
        lock_explanation:
          description:
            (Optional) An explanation of why this is locked for the user.
            Present when locked_for_user is true.
          example: This quiz is locked until September 1 at 12:00am
          nullable: true
          type: string
        lock_info:
          $ref: "#/components/schemas/LockInfo"
        locked_for_user:
          description: Whether or not this is locked for the user.
          example: false
          nullable: true
          type: boolean
        mobile_url:
          description:
            a url suitable for loading the quiz in a mobile webview.  it
            will persiste the headless session and, for quizzes in public courses,
            will force the user to login
          example: http://canvas.example.edu/courses/1/quizzes/2?persist_healdess=1&force_user=1
          nullable: true
          type: string
        one_question_at_a_time:
          description: show one question at a time?
          example: false
          nullable: true
          type: boolean
        one_time_results:
          description:
            prevent the students from seeing their results more than once
            (right after they submit the quiz)
          example: true
          nullable: true
          type: boolean
        permissions:
          $ref: "#/components/schemas/QuizPermissions"
        points_possible:
          description: The total point value given to the quiz
          example: 20
          nullable: true
          type: integer
        preview_url:
          description:
            A url that can be visited in the browser with a POST request
            to preview a quiz as the teacher. Only present when the user may grade
          example: http://canvas.example.edu/courses/1/quizzes/2/take?preview=1
          nullable: true
          type: string
        published:
          description: whether the quiz has a published or unpublished draft state.
          example: true
          nullable: true
          type: boolean
        question_count:
          description: the number of questions in the quiz
          example: 12
          nullable: true
          type: integer
        question_types:
          description: List of question types in the quiz
          example:
            - multiple_choice
            - essay
          items:
            type: string
          nullable: true
          type: array
        quiz_extensions_url:
          description: Link to endpoint to send extensions for this quiz.
          example: http://canvas.instructure.com/courses/1/quizzes/2/quiz_extensions
          nullable: true
          type: string
        quiz_type:
          description:
            "type of quiz possible values: 'practice_quiz', 'assignment',
            'graded_survey', 'survey'"
          example: assignment
          nullable: true
          type: string
        scoring_policy:
          description:
            "which quiz score to keep (only if allowed_attempts != 1) possible
            values: 'keep_highest', 'keep_latest'"
          example: keep_highest
          nullable: true
          type: string
        show_correct_answers:
          description:
            show which answers were correct when results are shown? only
            valid if hide_results=null
          example: true
          nullable: true
          type: boolean
        show_correct_answers_at:
          description:
            when should the correct answers be visible by students? only
            valid if show_correct_answers=true
          example: 2013-01-23 23:59:00-07:00
          format: date-time
          nullable: true
          type: string
        show_correct_answers_last_attempt:
          description:
            restrict the show_correct_answers option above to apply only
            to the last submitted attempt of a quiz that allows multiple attempts.
            only valid if show_correct_answers=true and allowed_attempts > 1
          example: true
          nullable: true
          type: boolean
        shuffle_answers:
          description: shuffle answers for students?
          example: false
          nullable: true
          type: boolean
        speedgrader_url:
          description:
            Link to Speed Grader for this quiz. Will not be present if
            quiz is unpublished
          example: http://canvas.instructure.com/courses/1/speed_grader?assignment_id=1
          nullable: true
          type: string
        time_limit:
          description: quiz time limit in minutes
          example: 5
          nullable: true
          type: integer
        title:
          description: the title of the quiz
          example: Hamlet Act 3 Quiz
          nullable: true
          type: string
        unlock_at:
          description: when to unlock the quiz
          example: 2013-01-21 23:59:00-07:00
          format: date-time
          nullable: true
          type: string
        unpublishable:
          description:
            Whether the assignment's 'published' state can be changed to
            false. Will be false if there are student submissions for the quiz.
          example: true
          nullable: true
          type: boolean
        version_number:
          description: Current version number of the quiz
          example: 3
          nullable: true
          type: integer
      type: object
