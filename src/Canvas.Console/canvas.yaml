info:
  title: Canvas API
  version: 1.0.0
openapi: 3.0.1  # TODO: Migrate to 3.1.0 and remove nullable schema copies
security:
  - bearerAuth: []
paths:
  /lti/assignments/{assignment_id}:
    get:
      deprecated: false
      description:
        "Get a single Canvas assignment by Canvas id or LTI id. Tool providers
        may only access

        assignments that are associated with their tool."
      operationId: get_single_assignment_lti
      parameters:
        - description: ID
          in: path
          name: assignment_id
          required: true
          schema:
            type: string
        - description: The id of the user. Can be a Canvas or LTI id for the user.
          in: query
          name: user_id
          schema:
            type: string
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LtiAssignment"
          description: No response was specified
      summary: Get a single assignment (lti)
      tags:
        - plagiarism_detection_platform_assignments
components:
  parameters:
    pageParam:
      in: query
      name: page
      required: false
      schema:
        type: string
        minimum: 0
      description:
        The bookmark leading to the next paginated page. This needs to be
        parsed from the response header ('Link' field).
    perPageParam:
      in: query
      name: per_page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: The numbers of items to return.
  schemas:
    Account:
      properties:
        default_group_storage_quota_mb:
          description:
            The storage quota for a group in the account in megabytes,
            if not otherwise specified
          example: 50
          nullable: true
          type: integer
        default_storage_quota_mb:
          description:
            The storage quota for the account in megabytes, if not otherwise
            specified
          example: 500
          nullable: true
          type: integer
        default_time_zone:
          description:
            The default time zone of the account. Allowed time zones are
            {http://www.iana.org/time-zones IANA time zones} or friendlier {http://api.rubyonrails.org/classes/ActiveSupport/TimeZone.html
            Ruby on Rails time zones}.
          example: America/Denver
          nullable: true
          type: string
        default_user_storage_quota_mb:
          description:
            The storage quota for a user in the account in megabytes, if
            not otherwise specified
          example: 50
          nullable: true
          type: integer
        id:
          description: the ID of the Account object
          example: 2
          nullable: true
          type: integer
        integration_id:
          description:
            The account's identifier in the Student Information System.
            Only included if the user has permission to view SIS information.
          example: 123xyz
          nullable: true
          type: string
        lti_guid:
          description:
            The account's identifier that is sent as context_id in LTI
            launches.
          example: 123xyz
          nullable: true
          type: string
        name:
          description: The display name of the account
          example: Canvas Account
          nullable: true
          type: string
        parent_account_id:
          description: The account's parent ID, or null if this is the root account
          example: 1
          nullable: true
          type: integer
        root_account_id:
          description: The ID of the root account, or null if this is the root account
          example: 1
          nullable: true
          type: integer
        sis_account_id:
          description:
            The account's identifier in the Student Information System.
            Only included if the user has permission to view SIS information.
          example: 123xyz
          nullable: true
          type: string
        sis_import_id:
          description:
            The id of the SIS import if created through SIS. Only included
            if the user has permission to manage SIS information.
          example: 12
          nullable: true
          type: integer
        uuid:
          description: The UUID of the account
          example: WvAHhY5FINzq5IyRIJybGeiXyFkG3SqHUPb7jZY5
          nullable: true
          type: string
        workflow_state:
          description: The state of the account. Can be 'active' or 'deleted'.
          example: active
          nullable: true
          type: string
      type: object
    AccountNotification:
      properties:
        end_at:
          description: When to expire the notification.
          example: 2013-08-29 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        icon:
          description: The icon to display with the message.  Defaults to warning.
          example: information
          nullable: true
          type: string
        message:
          description: The message to be sent in the notification.
          example: This is a test of the notification system.
          nullable: true
          type: string
        role_ids:
          description:
            The roles to send the notification to.  If roles is not passed
            it defaults to all roles
          example:
            - 1
          items:
            type: integer
          nullable: true
          type: array
        roles:
          description:
            (Deprecated) The roles to send the notification to.  If roles
            is not passed it defaults to all roles
          example:
            - StudentEnrollment
          items:
            type: string
          nullable: true
          type: array
        start_at:
          description: When to send out the notification.
          example: 2013-08-28 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        subject:
          description: The subject of the notifications
          example: Attention Students
          nullable: true
          type: string
      type: object
    ActivityStream:
      properties:
        created_at:
          example: "2011-07-13T09:12:00Z"
          type: string
        updated_at:
          example: "2011-07-25T08:52:41Z"
          type: string
        id:
          example: 123
          type: integer
        title:
          example: "Stream Item Subject"
          type: string
        message:
          description: The body text of the activity stream item.
          type: string
        type:
          example: "DiscussionTopic"
          type: string
        read_state:
          example: false
          type: boolean
        context_type:
          example: "course"
          type: string
        course_id:
          example: 123
          type: integer
        group_id:
          example: 123
          type: integer
        html_url:
          description: the URL to the Canvas web UI for this stream item
          type: string
    Admin:
      properties:
        id:
          description: The unique identifier for the account role/user assignment.
          example: 1023
          type: integer
        role:
          description:
            The account role assigned. This can be 'AccountAdmin' or a
            user-defined role created by the Roles API.
          example: AccountAdmin
          nullable: true
          type: string
        user:
          $ref: "#/components/schemas/User"
        workflow_state:
          description: The status of the account role/user assignment.
          example: deleted
          nullable: true
          type: string
      required:
        - id
      type: object
    Answer:
      properties:
        answer_comments:
          description: Specific contextual comments for a particular answer.
          example: Remember to check your spelling prior to submitting this answer.
          nullable: true
          type: string
        answer_match_left:
          description:
            Used in matching questions.  The static value of the answer
            that will be displayed on the left for students to match for.
          example: Salt Lake City
          nullable: true
          type: string
        answer_match_right:
          description:
            Used in matching questions. The correct match for the value
            given in answer_match_left.  Will be displayed in a dropdown with the
            other answer_match_right values..
          example: Utah
          nullable: true
          type: string
        answer_text:
          description: The text of the answer.
          example: Constantinople
          type: string
        answer_weight:
          description:
            An integer to determine correctness of the answer. Incorrect
            answers should be 0, correct answers should be non-negative.
          example: 100
          format: int64
          type: integer
        approximate:
          description:
            Used in numerical questions of type 'precision_answer'.  The
            value the answer should equal.
          example: 1234600000.0
          format: float
          nullable: true
          type: number
        blank_id:
          description: Used in fill in multiple blank and multiple dropdowns questions.
          example: 1170
          format: int64
          nullable: true
          type: integer
        end:
          description:
            Used in numerical questions of type 'range_answer'. The end
            of the allowed range (inclusive).
          example: 10
          format: int64
          nullable: true
          type: integer
        exact:
          description:
            Used in numerical questions of type 'exact_answer'.  The value
            the answer should equal.
          example: 42
          format: int64
          nullable: true
          type: integer
        id:
          description:
            The unique identifier for the answer.  Do not supply if this
            answer is part of a new question
          example: 6656
          format: int64
          nullable: true
          type: integer
        margin:
          description:
            Used in numerical questions of type 'exact_answer'. The margin
            of error allowed for the student's answer.
          example: 4
          format: int64
          nullable: true
          type: integer
        matching_answer_incorrect_matches:
          description:
            "Used in matching questions. A list of distractors, delimited
            by new lines (

            ) that will be seeded with all the answer_match_right values."
          example: "Nevada

            California

            Washington"
          nullable: true
          type: string
        numerical_answer_type:
          description:
            Used in numerical questions.  Values can be 'exact_answer',
            'range_answer', or 'precision_answer'.
          example: exact_answer
          nullable: true
          type: string
        precision:
          description:
            Used in numerical questions of type 'precision_answer'. The
            numerical precision that will be used when comparing the student's answer.
          example: 4
          format: int64
          nullable: true
          type: integer
        start:
          description:
            Used in numerical questions of type 'range_answer'. The start
            of the allowed range (inclusive).
          example: 1
          format: int64
          nullable: true
          type: integer
        text_after_answers:
          description:
            Used in missing word questions.  The text to follow the missing
            word
          example: " is the capital of Utah."
          nullable: true
          type: string
      required:
        - answer_text
        - answer_weight
      type: object
    Assignment:
      properties:
        all_dates:
          description: (Optional) all dates associated with the assignment, if applicable
          items:
            $ref: "#/components/schemas/AssignmentDate"
          nullable: true
          type: array
        allowed_extensions:
          description:
            Allowed file extensions, which take effect if submission_types
            includes 'online_upload'.
          example:
            - docx
            - ppt
          items:
            type: string
          nullable: true
          type: array
        anonymous_submissions:
          description:
            (Optional) whether anonymous submissions are accepted (applies
            only to quiz assignments)
          example: false
          nullable: true
          type: boolean
        assignment_group_id:
          description: the ID of the assignment's group
          example: 2
          nullable: true
          type: integer
        assignment_visibility:
          description:
            (Optional) If 'assignment_visibility' is included in the 'include'
            parameter, includes an array of student IDs who can see this assignment.
          example:
            - 137
            - 381
            - 572
          items:
            type: integer
          nullable: true
          type: array
        automatic_peer_reviews:
          description:
            Boolean indicating peer reviews are assigned automatically.
            If false, the teacher is expected to manually assign peer reviews.
          example: false
          nullable: true
          type: boolean
        course_id:
          description: the ID of the course the assignment belongs to
          example: 123
          nullable: true
          type: integer
        created_at:
          description: The time at which this assignment was originally created
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        description:
          description: the assignment description, in an HTML fragment
          example: <p>Do the following:</p>...
          nullable: true
          type: string
        discussion_topic:
          $ref: "#/components/schemas/DiscussionTopicNullable"
        due_at:
          description:
            "the due date for the assignment. returns null if not present.
            NOTE: If this assignment has assignment overrides, this field will be
            the due date as it applies to the user requesting information from the
            API."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        due_date_required:
          description:
            Boolean flag indicating whether the assignment requires a due
            date based on the account level setting
          example: true
          nullable: true
          type: boolean
        external_tool_tag_attributes:
          $ref: "#/components/schemas/ExternalToolTagAttributes"
        freeze_on_copy:
          description:
            "(Optional) Boolean indicating if assignment will be frozen
            when it is copied. NOTE: This field will only be present if the AssignmentFreezer
            plugin is available for your account."
          example: false
          nullable: true
          type: boolean
        frozen:
          description:
            "(Optional) Boolean indicating if assignment is frozen for
            the calling user. NOTE: This field will only be present if the AssignmentFreezer
            plugin is available for your account."
          example: false
          nullable: true
          type: boolean
        frozen_attributes:
          description:
            "(Optional) Array of frozen attributes for the assignment.
            Only account administrators currently have permission to change an attribute
            in this list. Will be empty if no attributes are frozen for this assignment.
            Possible frozen attributes are: title, description, lock_at, points_possible,
            grading_type, submission_types, assignment_group_id, allowed_extensions,
            group_category_id, notify_of_update, peer_reviews NOTE: This field will
            only be present if the AssignmentFreezer plugin is available for your
            account."
          example:
            - title
          items:
            type: string
          nullable: true
          type: array
        grade_group_students_individually:
          description:
            If this is a group assignment, boolean flag indicating whether
            or not students will be graded individually.
          example: false
          nullable: true
          type: boolean
        grading_standard_id:
          description:
            The id of the grading standard being applied to this assignment.
            Valid if grading_type is 'letter_grade' or 'gpa_scale'.
          nullable: true
          type: integer
        grading_type:
          description:
            The type of grading the assignment receives; one of 'pass_fail',
            'percent', 'letter_grade', 'gpa_scale', 'points'
          example: points
          nullable: true
          type: string
        group_category_id:
          description:
            The ID of the assignments group set, if this is a group assignment.
            For group discussions, set group_category_id on the discussion topic,
            not the linked assignment.
          example: 1
          nullable: true
          type: integer
        has_overrides:
          description: whether this assignment has overrides
          example: true
          nullable: true
          type: boolean
        has_submitted_submissions:
          description:
            If true, the assignment has been submitted to by at least one
            student
          example: true
          nullable: true
          type: boolean
        html_url:
          description: the URL to the assignment's web page
          example: https://...
          nullable: true
          type: string
        id:
          description: the ID of the assignment
          example: 4
          nullable: true
          type: integer
        integration_data:
          description: (optional, Third Party integration data for assignment)
          example:
            5678: 0954
          nullable: true
          type: object
          additionalProperties:
            type: string
        integration_id:
          description: (optional, Third Party unique identifier for Assignment)
          example: "12341234"
          nullable: true
          type: string
        intra_group_peer_reviews:
          description:
            Boolean representing whether or not members from within the
            same group on a group assignment can be assigned to peer review their
            own group's work
          example: false
          nullable: true
          type: boolean
        lock_at:
          description:
            "the lock date (assignment is locked after this date). returns
            null if not present. NOTE: If this assignment has assignment overrides,
            this field will be the lock date as it applies to the user requesting
            information from the API."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        lock_explanation:
          description:
            (Optional) An explanation of why this is locked for the user.
            Present when locked_for_user is true.
          example: This assignment is locked until September 1 at 12:00am
          nullable: true
          type: string
        lock_info:
          $ref: "#/components/schemas/LockInfo"
        locked_for_user:
          description: Whether or not this is locked for the user.
          example: false
          nullable: true
          type: boolean
        max_name_length:
          description:
            An integer indicating the maximum length an assignment's name
            may be
          example: 15
          nullable: true
          type: integer
        moderated_grading:
          description: Boolean indicating if the assignment is moderated.
          example: true
          nullable: true
          type: boolean
        muted:
          description: whether the assignment is muted
          nullable: true
          type: boolean
        name:
          description: the name of the assignment
          example: some assignment
          nullable: true
          type: string
        needs_grading_count:
          description:
            if the requesting user has grading rights, the number of submissions
            that need grading.
          example: 17
          nullable: true
          type: integer
        needs_grading_count_by_section:
          description:
            "if the requesting user has grading rights and the 'needs_grading_count_by_section'
            flag is specified, the number of submissions that need grading split out
            by section. NOTE: This key is NOT present unless you pass the 'needs_grading_count_by_section'
            argument as true.  ANOTHER NOTE: it's possible to be enrolled in multiple
            sections, and if a student is setup that way they will show an assignment
            that needs grading in multiple sections (effectively the count will be
            duplicated between sections)"
          example:
            - needs_grading_count: 5
              section_id: "123456"
            - needs_grading_count: 0
              section_id: "654321"
          items:
            $ref: "#/components/schemas/NeedsGradingCount"
          nullable: true
          type: array
        omit_from_final_grade:
          description:
            (Optional) If true, the assignment will be omitted from the
            student's final grade
          example: true
          nullable: true
          type: boolean
        only_visible_to_overrides:
          description: Whether the assignment is only visible to overrides.
          example: false
          nullable: true
          type: boolean
        overrides:
          description:
            (Optional) If 'overrides' is included in the 'include' parameter,
            includes an array of assignment override objects.
          items:
            $ref: "#/components/schemas/AssignmentOverride"
          nullable: true
          type: array
        peer_review_count:
          description:
            "Integer representing the amount of reviews each user is assigned.
            NOTE: This key is NOT present unless you have automatic_peer_reviews set
            to true."
          example: 0
          nullable: true
          type: integer
        peer_reviews:
          description: Boolean indicating if peer reviews are required for this assignment
          example: false
          nullable: true
          type: boolean
        peer_reviews_assign_at:
          description:
            "String representing a date the reviews are due by. Must be
            a date that occurs after the default due date. If blank, or date is not
            after the assignment's due date, the assignment's due date will be used.
            NOTE: This key is NOT present unless you have automatic_peer_reviews set
            to true."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        points_possible:
          description: the maximum points possible for the assignment
          example: 12
          nullable: true
          type: integer
        position:
          description: the sorting order of the assignment in the group
          example: 1
          nullable: true
          type: integer
        post_to_sis:
          description: (optional, present if Sync Grades to SIS feature is enabled)
          example: true
          nullable: true
          type: boolean
        published:
          description: Whether the assignment is published
          example: true
          nullable: true
          type: boolean
        quiz_id:
          description:
            (Optional) id of the associated quiz (applies only when submission_types
            is ['online_quiz'])
          example: 620
          nullable: true
          type: integer
        rubric:
          description:
            (Optional) A list of scoring criteria and ratings for each
            rubric criterion. Included if there is an associated rubric.
          items:
            $ref: "#/components/schemas/RubricCriteria"
          nullable: true
          type: array
        rubric_settings:
          $ref: "#/components/schemas/RubricSettings"
        submission:
          $ref: "#/components/schemas/SubmissionNullable"
        submission_types:
          description:
            "the types of submissions allowed for this assignment list
            containing one or more of the following: 'discussion_topic', 'online_quiz',
            'on_paper', 'none', 'external_tool', 'online_text_entry', 'online_url',
            'online_upload' 'media_recording'"
          example:
            - online_text_entry
          items:
            type: string
          nullable: true
          type: array
        submissions_download_url:
          description: the URL to download all submissions as a zip
          example: https://example.com/courses/:course_id/assignments/:id/submissions?zip=1
          nullable: true
          type: string
        turnitin_enabled:
          description:
            "Boolean flag indicating whether or not Turnitin has been enabled
            for the assignment. NOTE: This flag will not appear unless your account
            has the Turnitin plugin available"
          example: true
          nullable: true
          type: boolean
        turnitin_settings:
          $ref: "#/components/schemas/TurnitinSettings"
        unlock_at:
          description:
            "the unlock date (assignment is unlocked after this date) returns
            null if not present NOTE: If this assignment has assignment overrides,
            this field will be the unlock date as it applies to the user requesting
            information from the API."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        unpublishable:
          description:
            Whether the assignment's 'published' state can be changed to
            false. Will be false if there are student submissions for the assignment.
          example: false
          nullable: true
          type: boolean
        updated_at:
          description:
            The time at which this assignment was last modified in any
            way
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        use_rubric_for_grading:
          description:
            (Optional) If true, the rubric is directly tied to grading
            the assignment. Otherwise, it is only advisory. Included if there is an
            associated rubric.
          example: true
          nullable: true
          type: boolean
        vericite_enabled:
          description:
            "Boolean flag indicating whether or not VeriCite has been enabled
            for the assignment. NOTE: This flag will not appear unless your account
            has the VeriCite plugin available"
          example: true
          nullable: true
          type: boolean
      type: object
    AssignmentNullable:
      description: The submission's assignment (see the assignments API) (optional)
      example: Assignment
      nullable: true
      properties:
        all_dates:
          description: (Optional) all dates associated with the assignment, if applicable
          items:
            $ref: "#/components/schemas/AssignmentDate"
          nullable: true
          type: array
        allowed_extensions:
          description:
            Allowed file extensions, which take effect if submission_types
            includes 'online_upload'.
          example:
            - docx
            - ppt
          items:
            type: string
          nullable: true
          type: array
        anonymous_submissions:
          description:
            (Optional) whether anonymous submissions are accepted (applies
            only to quiz assignments)
          example: false
          nullable: true
          type: boolean
        assignment_group_id:
          description: the ID of the assignment's group
          example: 2
          nullable: true
          type: integer
        assignment_visibility:
          description:
            (Optional) If 'assignment_visibility' is included in the 'include'
            parameter, includes an array of student IDs who can see this assignment.
          example:
            - 137
            - 381
            - 572
          items:
            type: integer
          nullable: true
          type: array
        automatic_peer_reviews:
          description:
            Boolean indicating peer reviews are assigned automatically.
            If false, the teacher is expected to manually assign peer reviews.
          example: false
          nullable: true
          type: boolean
        course_id:
          description: the ID of the course the assignment belongs to
          example: 123
          nullable: true
          type: integer
        created_at:
          description: The time at which this assignment was originally created
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        description:
          description: the assignment description, in an HTML fragment
          example: <p>Do the following:</p>...
          nullable: true
          type: string
        discussion_topic:
          $ref: "#/components/schemas/DiscussionTopicNullable"
        due_at:
          description:
            "the due date for the assignment. returns null if not present.
            NOTE: If this assignment has assignment overrides, this field will be
            the due date as it applies to the user requesting information from the
            API."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        due_date_required:
          description:
            Boolean flag indicating whether the assignment requires a due
            date based on the account level setting
          example: true
          nullable: true
          type: boolean
        external_tool_tag_attributes:
          $ref: "#/components/schemas/ExternalToolTagAttributes"
        freeze_on_copy:
          description:
            "(Optional) Boolean indicating if assignment will be frozen
            when it is copied. NOTE: This field will only be present if the AssignmentFreezer
            plugin is available for your account."
          example: false
          nullable: true
          type: boolean
        frozen:
          description:
            "(Optional) Boolean indicating if assignment is frozen for
            the calling user. NOTE: This field will only be present if the AssignmentFreezer
            plugin is available for your account."
          example: false
          nullable: true
          type: boolean
        frozen_attributes:
          description:
            "(Optional) Array of frozen attributes for the assignment.
            Only account administrators currently have permission to change an attribute
            in this list. Will be empty if no attributes are frozen for this assignment.
            Possible frozen attributes are: title, description, lock_at, points_possible,
            grading_type, submission_types, assignment_group_id, allowed_extensions,
            group_category_id, notify_of_update, peer_reviews NOTE: This field will
            only be present if the AssignmentFreezer plugin is available for your
            account."
          example:
            - title
          items:
            type: string
          nullable: true
          type: array
        grade_group_students_individually:
          description:
            If this is a group assignment, boolean flag indicating whether
            or not students will be graded individually.
          example: false
          nullable: true
          type: boolean
        grading_standard_id:
          description:
            The id of the grading standard being applied to this assignment.
            Valid if grading_type is 'letter_grade' or 'gpa_scale'.
          nullable: true
          type: integer
        grading_type:
          description:
            The type of grading the assignment receives; one of 'pass_fail',
            'percent', 'letter_grade', 'gpa_scale', 'points'
          example: points
          nullable: true
          type: string
        group_category_id:
          description:
            The ID of the assignments group set, if this is a group assignment.
            For group discussions, set group_category_id on the discussion topic,
            not the linked assignment.
          example: 1
          nullable: true
          type: integer
        has_overrides:
          description: whether this assignment has overrides
          example: true
          nullable: true
          type: boolean
        has_submitted_submissions:
          description:
            If true, the assignment has been submitted to by at least one
            student
          example: true
          nullable: true
          type: boolean
        html_url:
          description: the URL to the assignment's web page
          example: https://...
          nullable: true
          type: string
        id:
          description: the ID of the assignment
          example: 4
          nullable: true
          type: integer
        integration_data:
          description: (optional, Third Party integration data for assignment)
          example:
            5678: 0954
          nullable: true
          type: object
          additionalProperties:
            type: string
        integration_id:
          description: (optional, Third Party unique identifier for Assignment)
          example: "12341234"
          nullable: true
          type: string
        intra_group_peer_reviews:
          description:
            Boolean representing whether or not members from within the
            same group on a group assignment can be assigned to peer review their
            own group's work
          example: false
          nullable: true
          type: boolean
        lock_at:
          description:
            "the lock date (assignment is locked after this date). returns
            null if not present. NOTE: If this assignment has assignment overrides,
            this field will be the lock date as it applies to the user requesting
            information from the API."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        lock_explanation:
          description:
            (Optional) An explanation of why this is locked for the user.
            Present when locked_for_user is true.
          example: This assignment is locked until September 1 at 12:00am
          nullable: true
          type: string
        lock_info:
          $ref: "#/components/schemas/LockInfo"
        locked_for_user:
          description: Whether or not this is locked for the user.
          example: false
          nullable: true
          type: boolean
        max_name_length:
          description:
            An integer indicating the maximum length an assignment's name
            may be
          example: 15
          nullable: true
          type: integer
        moderated_grading:
          description: Boolean indicating if the assignment is moderated.
          example: true
          nullable: true
          type: boolean
        muted:
          description: whether the assignment is muted
          nullable: true
          type: boolean
        name:
          description: the name of the assignment
          example: some assignment
          nullable: true
          type: string
        needs_grading_count:
          description:
            if the requesting user has grading rights, the number of submissions
            that need grading.
          example: 17
          nullable: true
          type: integer
        needs_grading_count_by_section:
          description:
            "if the requesting user has grading rights and the 'needs_grading_count_by_section'
            flag is specified, the number of submissions that need grading split out
            by section. NOTE: This key is NOT present unless you pass the 'needs_grading_count_by_section'
            argument as true.  ANOTHER NOTE: it's possible to be enrolled in multiple
            sections, and if a student is setup that way they will show an assignment
            that needs grading in multiple sections (effectively the count will be
            duplicated between sections)"
          example:
            - needs_grading_count: 5
              section_id: "123456"
            - needs_grading_count: 0
              section_id: "654321"
          items:
            $ref: "#/components/schemas/NeedsGradingCount"
          nullable: true
          type: array
        omit_from_final_grade:
          description:
            (Optional) If true, the assignment will be omitted from the
            student's final grade
          example: true
          nullable: true
          type: boolean
        only_visible_to_overrides:
          description: Whether the assignment is only visible to overrides.
          example: false
          nullable: true
          type: boolean
        overrides:
          description:
            (Optional) If 'overrides' is included in the 'include' parameter,
            includes an array of assignment override objects.
          items:
            $ref: "#/components/schemas/AssignmentOverride"
          nullable: true
          type: array
        peer_review_count:
          description:
            "Integer representing the amount of reviews each user is assigned.
            NOTE: This key is NOT present unless you have automatic_peer_reviews set
            to true."
          example: 0
          nullable: true
          type: integer
        peer_reviews:
          description: Boolean indicating if peer reviews are required for this assignment
          example: false
          nullable: true
          type: boolean
        peer_reviews_assign_at:
          description:
            "String representing a date the reviews are due by. Must be
            a date that occurs after the default due date. If blank, or date is not
            after the assignment's due date, the assignment's due date will be used.
            NOTE: This key is NOT present unless you have automatic_peer_reviews set
            to true."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        points_possible:
          description: the maximum points possible for the assignment
          example: 12
          nullable: true
          type: integer
        position:
          description: the sorting order of the assignment in the group
          example: 1
          nullable: true
          type: integer
        post_to_sis:
          description: (optional, present if Sync Grades to SIS feature is enabled)
          example: true
          nullable: true
          type: boolean
        published:
          description: Whether the assignment is published
          example: true
          nullable: true
          type: boolean
        quiz_id:
          description:
            (Optional) id of the associated quiz (applies only when submission_types
            is ['online_quiz'])
          example: 620
          nullable: true
          type: integer
        rubric:
          description:
            (Optional) A list of scoring criteria and ratings for each
            rubric criterion. Included if there is an associated rubric.
          items:
            $ref: "#/components/schemas/RubricCriteria"
          nullable: true
          type: array
        rubric_settings:
          $ref: "#/components/schemas/RubricSettings"
        submission:
          $ref: "#/components/schemas/SubmissionNullable"
        submission_types:
          description:
            "the types of submissions allowed for this assignment list
            containing one or more of the following: 'discussion_topic', 'online_quiz',
            'on_paper', 'none', 'external_tool', 'online_text_entry', 'online_url',
            'online_upload' 'media_recording'"
          example:
            - online_text_entry
          items:
            type: string
          nullable: true
          type: array
        submissions_download_url:
          description: the URL to download all submissions as a zip
          example: https://example.com/courses/:course_id/assignments/:id/submissions?zip=1
          nullable: true
          type: string
        turnitin_enabled:
          description:
            "Boolean flag indicating whether or not Turnitin has been enabled
            for the assignment. NOTE: This flag will not appear unless your account
            has the Turnitin plugin available"
          example: true
          nullable: true
          type: boolean
        turnitin_settings:
          $ref: "#/components/schemas/TurnitinSettings"
        unlock_at:
          description:
            "the unlock date (assignment is unlocked after this date) returns
            null if not present NOTE: If this assignment has assignment overrides,
            this field will be the unlock date as it applies to the user requesting
            information from the API."
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        unpublishable:
          description:
            Whether the assignment's 'published' state can be changed to
            false. Will be false if there are student submissions for the assignment.
          example: false
          nullable: true
          type: boolean
        updated_at:
          description:
            The time at which this assignment was last modified in any
            way
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        use_rubric_for_grading:
          description:
            (Optional) If true, the rubric is directly tied to grading
            the assignment. Otherwise, it is only advisory. Included if there is an
            associated rubric.
          example: true
          nullable: true
          type: boolean
        vericite_enabled:
          description:
            "Boolean flag indicating whether or not VeriCite has been enabled
            for the assignment. NOTE: This flag will not appear unless your account
            has the VeriCite plugin available"
          example: true
          nullable: true
          type: boolean
      type: object
    AssignmentDate:
      description:
        Object representing a due date for an assignment or quiz. If the
        due date came from an assignment override, it will have an 'id' field.
      properties:
        base:
          description:
            (Optional, present if 'id' is missing) whether this date represents
            the assignment's or quiz's default due date
          example: true
          nullable: true
          type: boolean
        due_at:
          description:
            The due date for the assignment. Must be between the unlock
            date and the lock date if there are lock dates
          example: 2013-08-28 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        id:
          description:
            (Optional, missing if 'base' is present) id of the assignment
            override this date represents
          example: 1
          nullable: true
          type: integer
        lock_at:
          description:
            The lock date for the assignment. Must be after the due date
            if there is a due date.
          example: 2013-08-31 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        title:
          example: Summer Session
          nullable: true
          type: string
        unlock_at:
          description:
            The unlock date for the assignment. Must be before the due
            date if there is a due date.
          example: 2013-08-01 00:00:00-06:00
          format: date-time
          nullable: true
          type: string
      type: object
    AssignmentGroup:
      properties:
        assignments:
          description:
            the assignments in this Assignment Group (see the Assignment
            API for a detailed list of fields)
          example: []
          items:
            type: integer
          nullable: true
          type: array
        group_weight:
          description: the weight of the Assignment Group
          example: 20
          nullable: true
          type: integer
        id:
          description: the id of the Assignment Group
          example: 1
          nullable: true
          type: integer
        integration_data:
          description: the integration data of the Assignment Group
          example:
            5678: 0954
          nullable: true
          properties: {}
          type: object
        name:
          description: the name of the Assignment Group
          example: group2
          nullable: true
          type: string
        position:
          description: the position of the Assignment Group
          example: 7
          nullable: true
          type: integer
        rules:
          $ref: "#/components/schemas/GradingRules"
        sis_source_id:
          description: the sis source id of the Assignment Group
          example: "1234"
          nullable: true
          type: string
      type: object
    AssignmentOverride:
      properties:
        all_day:
          description: the overridden all day flag (present if due_at is overridden)
          nullable: true
          type: integer
        all_day_date:
          description: the overridden all day date (present if due_at is overridden)
          format: date-time
          nullable: true
          type: string
        assignment_id:
          description: the ID of the assignment the override applies to
          example: 123
          nullable: true
          type: integer
        course_section_id:
          description:
            the ID of the overrides's target section (present if the override
            targets a section)
          example: 1
          nullable: true
          type: integer
        due_at:
          description: the overridden due at (present if due_at is overridden)
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        group_id:
          description:
            the ID of the override's target group (present if the override
            targets a group and the assignment is a group assignment)
          example: 2
          nullable: true
          type: integer
        id:
          description: the ID of the assignment override
          example: 4
          nullable: true
          type: integer
        lock_at:
          description: the overridden lock at, if any (present if lock_at is overridden)
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
        student_ids:
          description:
            the IDs of the override's target students (present if the override
            targets an ad-hoc set of students)
          example:
            - 1
            - 2
            - 3
          items:
            type: integer
          nullable: true
          type: array
        title:
          description: the title of the override
          example: an assignment override
          nullable: true
          type: string
        unlock_at:
          description: the overridden unlock at (present if unlock_at is overridden)
          example: 2012-07-01 23:59:00-06:00
          format: date-time
          nullable: true
          type: string
      type: object
    AuthenticationProvider:
