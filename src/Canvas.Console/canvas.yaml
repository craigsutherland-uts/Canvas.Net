    QuizSubmission:
      properties:
        attempt:
          description:
            For quizzes that allow multiple attempts, this field specifies
            the quiz submission attempt number.
          example: 3
          format: int64
          nullable: true
          type: integer
        end_at:
          description:
            The time at which the quiz submission will be overdue, and
            be flagged as a late submission.
          example: 2013-11-07 13:16:18+00:00
          format: date-time
          nullable: true
          type: string
        extra_attempts:
          description:
            Number of times the student was allowed to re-take the quiz
            over the multiple-attempt limit.
          example: 1
          format: int64
          nullable: true
          type: integer
        extra_time:
          description: Amount of extra time allowed for the quiz submission, in minutes.
          example: 60
          format: int64
          nullable: true
          type: integer
        finished_at:
          description: The time at which the student submitted the quiz submission.
          example: 2013-11-07 13:16:18+00:00
          format: date-time
          nullable: true
          type: string
        fudge_points:
          description: Number of points the quiz submission's score was fudged by.
          example: 1
          format: int64
          nullable: true
          type: integer
        has_seen_results:
          description: Whether the student has viewed their results to the quiz.
          example: true
          nullable: true
          type: boolean
        id:
          description: The ID of the quiz submission.
          example: 1
          format: int64
          type: integer
        kept_score:
          description:
            For quizzes that allow multiple attempts, this is the score
            that will be used, which might be the score of the latest, or the highest,
            quiz submission.
          example: 5
          format: int64
          nullable: true
          type: integer
        manually_unlocked:
          description:
            The student can take the quiz even if it's locked for everyone
            else
          example: true
          nullable: true
          type: boolean
        overdue_and_needs_submission:
          description:
            Indicates whether the quiz submission is overdue and needs
            submission
          example: false
          nullable: true
          type: boolean
        quiz_id:
          description: The ID of the Quiz the quiz submission belongs to.
          example: 2
          format: int64
          type: integer
        score:
          description: The score of the quiz submission, if graded.
          example: 3
          format: int64
          nullable: true
          type: integer
        score_before_regrade:
          description: The original score of the quiz submission prior to any re-grading.
          example: 2
          format: int64
          nullable: true
          type: integer
        started_at:
          description: The time at which the student started the quiz submission.
          example: 2013-11-07 13:16:18+00:00
          format: date-time
          nullable: true
          type: string
        submission_id:
          description: The ID of the Submission the quiz submission represents.
          example: 1
          format: int64
          nullable: true
          type: integer
        time_spent:
          description: Amount of time spent, in seconds.
          example: 300
          format: int64
          nullable: true
          type: integer
        user_id:
          description: The ID of the Student that made the quiz submission.
          example: 3
          format: int64
          nullable: true
          type: integer
        workflow_state:
          description:
            "The current state of the quiz submission. Possible values:
            ['untaken'|'pending_review'|'complete'|'settings_only'|'preview']."
          example: untaken
          nullable: true
          type: string
      required:
        - id
        - quiz_id
      type: object
    QuizSubmissionQuestion:
